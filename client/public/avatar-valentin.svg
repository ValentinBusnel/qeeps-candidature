    <path d="M128 114 C126 124 122 132 120 136 C124 141 132 141 136 136" fill="none" stroke="#C98663" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="128" cy="128" rx="5" ry="8" fill="#FFE3CC" opacity="0.5"/>

    <!-- grand sourire, dents du haut visibles -->
    <path d="M98 146 C112 151 144 151 158 146 C154 162 142 168 128 168 C114 168 102 162 98 146 Z" fill="#7E3730"/>
    <path d="M101 147.5 C114 152 142 152 155 147.5 C153 156 140 160 128 160 C116 160 103 156 101 147.5 Z" fill="#FFFDF8"/>
    <path d="M128 150 L128 159" stroke="#E8DED2" stroke-width="1.2"/>
    <path d="M110 162 C118 167 138 167 146 162 C140 166 116 166 110 162 Z" fill="#E59084"/>
    <path d="M98 146 C112 151 144 151 158 146" fill="none" stroke="#C47A62" stroke-width="2" stroke-linecap="round"/>
    <path d="M94 144 C96 146 98 147 100 147" fill="none" stroke="#C98663" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M162 144 C160 146 158 147 156 147" fill="none" stroke="#C98663" stroke-width="2.4" stroke-linecap="round"/>

    <!-- barbe de quelques jours -->
    <path d="M86 150 C92 176 110 186 128 186 C146 186 164 176 170 150 C166 170 150 182 128 182 C106 182 90 170 86 150 Z" fill="#B58A60" opacity="0.18"/>
    <path d="M112 142 C120 140 136 140 144 142" fill="none" stroke="#B58A60" stroke-width="5" stroke-linecap="round" opacity="0.18"/>
  </g>
</svg>
