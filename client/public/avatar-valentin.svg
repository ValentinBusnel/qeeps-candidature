    <path d="M28 256 C34 214 70 196 128 196 C186 196 222 214 228 256 Z" fill="url(#sweater)"/>
    <path d="M92 202 C104 222 152 222 164 202 C160 196 96 196 92 202 Z" fill="#CFCCC7"/>
