    <g>
      <path d="M88 110 C94 100 112 100 118 110 C112 116 94 116 88 110 Z" fill="#FFFFFF"/>
      <circle cx="103" cy="108.5" r="6.4" fill="url(#iris)"/>
      <circle cx="103" cy="108.5" r="3" fill="#2B2A1F"/>
      <circle cx="105" cy="106" r="1.8" fill="#FFFFFF"/>
      <path d="M86 111 C93 99 113 99 120 111" fill="none" stroke="#7A5A3E" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M90 117 C98 121 110 121 117 116" fill="none" stroke="#D49A78" stroke-width="2" stroke-linecap="round"/>

      <path d="M138 110 C144 100 162 100 168 110 C162 116 144 116 138 110 Z" fill="#FFFFFF"/>
      <circle cx="153" cy="108.5" r="6.4" fill="url(#iris)"/>
      <circle cx="153" cy="108.5" r="3" fill="#2B2A1F"/>
      <circle cx="155" cy="106" r="1.8" fill="#FFFFFF"/>
      <path d="M136 111 C143 99 163 99 170 111" fill="none" stroke="#7A5A3E" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M139 116 C146 121 158 121 166 117" fill="none" stroke="#D49A78" stroke-width="2" stroke-linecap="round"/>
