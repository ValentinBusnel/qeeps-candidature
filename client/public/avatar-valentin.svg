      <path d="M96 78 C112 56 142 48 172 56" stroke="#A47442" stroke-width="2.6" opacity="0.5"/>
      <path d="M154 24 C180 34 198 56 200 88" stroke="#F3D7A3" stroke-width="2.6" opacity="0.6"/>
      <path d="M68 104 C68 76 80 52 104 36" stroke="#A47442" stroke-width="2.6" opacity="0.45"/>
      <path d="M120 70 C132 58 150 54 166 58" stroke="#F3D7A3" stroke-width="2" opacity="0.6"/>
    </g>

