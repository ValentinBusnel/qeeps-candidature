    <ellipse cx="194" cy="126" rx="12" ry="18" fill="url(#ear)"/>
    <path d="M60 118 C56 126 58 134 64 138" fill="none" stroke="#C17E5E" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M196 118 C200 126 198 134 192 138" fill="none" stroke="#C17E5E" stroke-width="2.5" stroke-linecap="round"/>

