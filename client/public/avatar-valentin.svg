      <path d="M70 230 l4 6 l4 -6 l4 6 l4 -6"/><path d="M170 230 l4 6 l4 -6 l4 6 l4 -6"/>
      <path d="M58 248 l4 6 l4 -6 l4 6 l4 -6"/><path d="M182 248 l4 6 l4 -6 l4 6 l4 -6"/>
      <path d="M118 236 l4 6 l4 -6 l4 6 l4 -6"/>
