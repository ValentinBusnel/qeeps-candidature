<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 12 192 192" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3F1CF"/>
      <stop offset="1" stop-color="#A9E5B9"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.45" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#FAD3B4"/>
      <stop offset="0.6" stop-color="#EDB894"/>
      <stop offset="1" stop-color="#D99A74"/>
    </radialGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C98663"/>
      <stop offset="1" stop-color="#E3AA86"/>
    </linearGradient>
    <radialGradient id="ear" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#E9A887"/>
      <stop offset="1" stop-color="#D4916E"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7C48C"/>
      <stop offset="0.5" stop-color="#C99A5E"/>
      <stop offset="1" stop-color="#A97A45"/>
    </linearGradient>
    <linearGradient id="hairHi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6DDAE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F6DDAE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F6DDAE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E2DE"/>
      <stop offset="1" stop-color="#BDBAB4"/>
