    <radialGradient id="iris" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#A8B07A"/>
      <stop offset="1" stop-color="#5E6B3C"/>
    </radialGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F08F7A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F08F7A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="0" y="0" width="256" height="256"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
