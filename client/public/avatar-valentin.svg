    <ellipse cx="168" cy="140" rx="16" ry="10" fill="url(#blush)"/>

    <!-- cheveux : blond mi-long, coiffé vers l'arrière avec une mèche sur le côté -->
    <path d="M58 122 C46 84 60 44 96 26 C120 12 160 12 184 30 C206 48 210 84 198 122
             C196 104 190 90 180 82 C170 72 156 70 142 66 C124 62 106 66 92 76 C78 86 68 102 64 124 Z" fill="url(#hair)"/>
    <path d="M58 122 C54 112 54 100 60 92 C62 104 66 114 70 120 Z" fill="#B88A52"/>
